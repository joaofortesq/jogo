name: Gerar APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Escolher e descompactar o projeto (sempre o zip mais novo)
        shell: bash
        run: |
          best=""; bestv=""
          for z in mundo_divertido*.zip; do
            [ -f "$z" ] || continue
            v=$(unzip -p "$z" mundo_divertido/VERSION.txt 2>/dev/null | head -n1 | tr -d '\r\n ' || true)
            echo "Encontrado: $z  -> versão: ${v:-antiga, sem VERSION.txt}"
            if [ -z "$best" ] || [[ "${v:-0}" > "$bestv" ]]; then best="$z"; bestv="${v:-0}"; fi
          done
          if [ -n "$best" ]; then
            echo "USANDO O ZIP: $best (versão $bestv)"
            rm -rf mundo_divertido
            unzip -q -o "$best"
          else
            echo "Nenhum zip encontrado: usando a pasta mundo_divertido do repositório"
          fi
          echo "VERSÃO DO CÓDIGO: $(cat mundo_divertido/VERSION.txt 2>/dev/null || echo desconhecida)"
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar Android
        working-directory: mundo_divertido
        run: |
          flutter create --platforms=android --org br.com.mundodivertido .
          rm -f test/widget_test.dart
          python3 tools/patch_android.py
          python3 tools/apply_icon.py
          flutter pub get

      - name: Gerar vozes (pronúncia em português e inglês)
        working-directory: mundo_divertido
        continue-on-error: true
        env:
          # Opcional: chave do Google Cloud TTS (melhor pronúncia). Sem ela usa edge-tts.
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: |
          pip install edge-tts gTTS
          python3 tools/generate_voices.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mundo-divertido-vozes
          path: |
            mundo_divertido/assets/audio/pt_br
            mundo_divertido/assets/audio/en_us
          if-no-files-found: ignore

      - name: flutter analyze
        working-directory: mundo_divertido
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ../analyze.log

      - name: flutter test
        working-directory: mundo_divertido
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --timeout=60s 2>&1 | tee ../test.log

      - name: Gerar APK
        working-directory: mundo_divertido
        run: flutter build apk --release

      - name: Resumo (versão usada, erros do analyze e testes que falharam)
        if: always()
        run: |
          {
            echo "## Versão do código usada: $(cat mundo_divertido/VERSION.txt 2>/dev/null || echo desconhecida)"
            echo '## flutter analyze'; echo '```'; tail -n 60 analyze.log 2>/dev/null; echo '```'
            echo '## flutter test: resultado'; echo '```'; tail -n 3 test.log 2>/dev/null; echo '```'
            echo '## flutter test: testes que falharam (primeiras linhas de cada um)'; echo '```'
            awk '/^::group::❌/{p=1;n=0} p{print; n++} /^::endgroup::/{p=0} n>=24{p=0}' test.log 2>/dev/null | head -n 240
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-testes
          path: |
            test.log
            analyze.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: mundo-divertido-apk
          path: mundo_divertido/build/app/outputs/flutter-apk/app-release.apk
