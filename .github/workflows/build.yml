name: Gerar APK

on:
  workflow_dispatch:
  push:

# Se você enviar dois pushes seguidos, cancela o build antigo e fica só o último.
concurrency:
  group: gerar-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar o projeto (se subiu o zip)
        run: |
          echo "Arquivos na raiz:"; ls -la
          zip_file=$(find . -maxdepth 3 -iname 'mundo_divertido*.zip' | head -n 1)
          if [ -n "$zip_file" ]; then
            echo "Descompactando: $zip_file"
            rm -rf _zip_tmp && mkdir _zip_tmp
            unzip -q -o "$zip_file" -d _zip_tmp
            if [ -f _zip_tmp/pubspec.yaml ]; then
              # zip feito com o conteúdo do projeto solto na raiz
              rm -rf mundo_divertido && mkdir mundo_divertido
              cp -a _zip_tmp/. mundo_divertido/
            elif [ -d _zip_tmp/mundo_divertido ]; then
              # zip feito com a pasta mundo_divertido por fora
              rm -rf mundo_divertido
              cp -a _zip_tmp/mundo_divertido .
            else
              echo "ERRO: não achei pubspec.yaml dentro do zip."
              find _zip_tmp -maxdepth 2 | head -n 40
              exit 1
            fi
            rm -rf _zip_tmp
          else
            echo "Nenhum zip encontrado; usando a pasta mundo_divertido do repositório, se existir."
          fi
          if [ ! -f mundo_divertido/pubspec.yaml ]; then
            echo "ERRO: mundo_divertido/pubspec.yaml não existe."
            find . -maxdepth 3 -not -path './.git/*' | head -n 40
            exit 1
          fi
          echo "Versão do código: $(cat mundo_divertido/VERSION.txt 2>/dev/null || echo desconhecida)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar Android
        working-directory: mundo_divertido
        run: |
          flutter create --platforms=android --org br.com.mundodivertido .
          rm -f test/widget_test.dart
          python3 tools/patch_android.py
          python3 tools/apply_icon.py
          flutter pub get

      - name: Gerar vozes (animais, frutas, cores, letras e números em português e inglês)
        working-directory: mundo_divertido
        continue-on-error: true
        env:
          # Opcional: chave do Google Cloud TTS (melhor pronúncia). Sem ela usa edge-tts.
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: |
          pip install edge-tts gTTS
          python3 tools/generate_voices.py

      - name: Conferir as vozes geradas
        if: always()
        working-directory: mundo_divertido
        run: |
          pt=$(ls assets/audio/pt_br/*.mp3 2>/dev/null | wc -l)
          en=$(ls assets/audio/en_us/*.mp3 2>/dev/null | wc -l)
          letras=$(ls assets/audio/pt_br/letter_*.mp3 2>/dev/null | wc -l)
          numeros=$(ls assets/audio/pt_br/num_*.mp3 2>/dev/null | wc -l)
          letras_en=$(ls assets/audio/en_us/letter_*.mp3 2>/dev/null | wc -l)
          numeros_en=$(ls assets/audio/en_us/num_*.mp3 2>/dev/null | wc -l)
          {
            echo '## Vozes geradas'
            echo "- português: $pt arquivos (letras: $letras de 26, números: $numeros de 11)"
            echo "- inglês: $en arquivos (letras: $letras_en de 26, números: $numeros_en de 11)"
            echo '- o que faltar usa a voz do aparelho (o app continua funcionando)'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mundo-divertido-vozes
          path: |
            mundo_divertido/assets/audio/pt_br
            mundo_divertido/assets/audio/en_us
          if-no-files-found: ignore

      - name: flutter analyze
        working-directory: mundo_divertido
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ../analyze.log

      - name: flutter test
        working-directory: mundo_divertido
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --reporter expanded --no-color --timeout=60s 2>&1 | tee ../test.log

      - name: Gerar APK
        working-directory: mundo_divertido
        run: flutter build apk --release

      - name: Resumo dos erros (aba Summary)
        if: always()
        run: |
          {
            echo '## flutter analyze'; echo '```'; tail -n 60 analyze.log 2>/dev/null || echo "sem log"; echo '```'
            echo '## flutter test - detalhes dos que falharam'; echo '```'
            grep -n -A 22 '\[E\]' test.log 2>/dev/null | head -n 220 || true
            echo '```'
            echo '## flutter test - final'; echo '```'; tail -n 5 test.log 2>/dev/null || echo "sem log"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            analyze.log
            test.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: mundo-divertido-apk
          path: mundo_divertido/build/app/outputs/flutter-apk/app-release.apk
