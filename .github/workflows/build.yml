name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar o zip
        run: |
          unzip -o ./*.zip
          ls

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: cd mundo-divertido-apk && npm install

      - name: Criar projeto Android
        run: |
          cd mundo-divertido-apk
          npx cap add android
          npx cap sync android
          sed -i '0,/<activity/s//<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Gerar APK
        run: |
          cd mundo-divertido-apk/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: mundo-divertido-apk
          path: mundo-divertido-apk/android/app/build/outputs/apk/debug/app-debug.apk
