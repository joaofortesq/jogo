name: Gerar APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar o projeto (se subiu o zip)
        run: |
          if [ -f mundo_divertido.zip ]; then unzip -q -o mundo_divertido.zip; fi
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar Android
        working-directory: mundo_divertido
        run: |
          flutter create --platforms=android --org br.com.mundodivertido .
          rm -f test/widget_test.dart
          python3 tools/patch_android.py
          flutter pub get

      - name: flutter analyze
        working-directory: mundo_divertido
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ../analyze.log

      - name: flutter test
        working-directory: mundo_divertido
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test 2>&1 | tee ../test.log

      - name: Gerar APK
        working-directory: mundo_divertido
        run: flutter build apk --release

      - name: Resumo dos erros (aba Summary)
        if: always()
        run: |
          {
            echo '## flutter analyze'; echo '```'; tail -n 80 analyze.log 2>/dev/null; echo '```'
            echo '## flutter test';    echo '```'; tail -n 80 test.log 2>/dev/null;    echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: mundo-divertido-apk
          path: mundo_divertido/build/app/outputs/flutter-apk/app-release.apk
