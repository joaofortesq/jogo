name: Gerar APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar o projeto
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -q -o "$z"; done
          ls
          test -d mundo-divertido-apk || (echo "Pasta mundo-divertido-apk não encontrada"; exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        working-directory: mundo-divertido-apk
        run: |
          npm install
          npx cap add android
          npx cap sync android
          sed -i '0,/<activity/s//<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Gerar APK
        working-directory: mundo-divertido-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: mundo-divertido-apk
          path: mundo-divertido-apk/android/app/build/outputs/apk/debug/app-debug.apk
